      <div class="flex h-[50px] w-[130px] flex-col items-center justify-center pt-0.5" style="background-image:url('/assets/images/bingkai kecil.svg');background-size:100% 100%">

    </div>
    <div class="flex w-[660px] flex-col rounded-2xl border-2 border-majapahit-gold/80 bg-stone-dark/90 px-4 py-3 shadow-[0_10px_30px_rgba(0,0,0,.6)]">
      <p class="font-poppins text-[11px] text-stone-soft/80">Klik pitakon utawa kothak, banjur ketik wangsulane nganggo keyboard aksara. <b class="text-majapahit-light-gold">1 kothak = 1 suku kata aksara.</b></p>
      <div class="mt-2 grid flex-1 grid-cols-2 gap-4">
