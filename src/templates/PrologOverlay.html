<div id="prolog-overlay" class="absolute inset-0 hidden pointer-events-none p-6 transition-all duration-300 select-none flex-col justify-between">
  
  <!-- TOP ROW: Prolog Step & Skip Button -->
  <div class="flex justify-between items-start w-full">
    <!-- Step Progress Box -->
    <div class="flex flex-col items-center justify-center pointer-events-auto shadow-xl w-[150px] h-[44px] pt-1" style="background-image: url('/assets/images/bingkai kecil.svg'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; background-color: transparent;">
      <div class="flex justify-center items-center gap-1.5">
        <span class="font-cinzel text-majapahit-light-gold text-[10px] font-bold tracking-wider uppercase leading-none">Prolog</span>
        <span id="prolog-step-text" class="font-poppins text-stone-soft text-[9px] font-semibold leading-none">1 / 9</span>
      </div>
      <!-- Progress Bar -->
      <div class="w-24 bg-stone-light/30 h-1 rounded-full overflow-hidden mt-1 border border-stone-light/20">
        <div id="prolog-progress-bar" class="bg-majapahit-gold h-full w-[11.1%] rounded-full shadow-md transition-all duration-300"></div>
      </div>
    </div>

    <!-- Skip Button -->
    <button id="prolog-btn-skip" class="flex items-center justify-center gap-1.5 w-[140px] h-[44px] hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer text-majapahit-light-gold hover:text-majapahit-cream text-xs font-bold font-cinzel tracking-widest pointer-events-auto shadow-xl" style="background-image: url('/assets/images/button kecil.svg'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; background-color: transparent;">
      LEWATI
      <svg class="w-4 h-4 text-majapahit-light-gold hover:text-majapahit-cream" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polyline points="13 17 18 12 13 7"></polyline>
        <polyline points="6 17 11 12 6 7"></polyline>
      </svg>
    </button>
  </div>

  <!-- BOTTOM ROW: Dialog Box Panel -->
  <div class="w-full flex justify-center pb-2">
    <div class="relative w-[800px] aspect-6122/1690 pointer-events-auto flex flex-col justify-between select-none" style="background-image: url('/assets/images/bingkai-prolog.webp'); background-size: 100% 100%;">
      <!-- Text Area -->
      <div class="pl-10 pr-10 pt-25 pb-14 w-full h-full flex justify-start">
        <p id="prolog-text" class="font-poppins text-[15px] text-stone-dark leading-relaxed text-left font-semibold">
          Baskara menemukan sebuah batu bertuliskan aksara Jawa kuno.
        </p>
      </div>

      <!-- Next Button (Positioned inside the frame on the right side) -->
      <button id="prolog-btn-next" class="absolute bottom-11 right-10 flex items-center justify-center gap-1.5 w-[140px] h-[44px] hover:scale-105 active:scale-95 transition-all duration-200 cursor-pointer text-majapahit-light-gold hover:text-majapahit-cream text-xs font-bold font-cinzel tracking-widest shadow-md" style="background-image: url('/assets/images/button kecil.svg'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; background-color: transparent;">
        <span id="prolog-next-label">LANJUT</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

</div>
