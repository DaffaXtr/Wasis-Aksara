<div id="level3-overlay" class="absolute inset-0 hidden pointer-events-none select-none transition-opacity duration-500">
  <!-- HUD Top Bar -->
  <div id="l3-hud" class="absolute inset-x-0 top-0 z-20 flex items-start justify-between p-5 opacity-0 transition-opacity duration-500">
    <div class="flex h-[52px] w-[210px] flex-col items-center justify-center" style="background-image:url('/assets/images/bingkai kecil.svg');background-size:100% 100%;background-repeat:no-repeat">
      <span class="font-cinzel text-[11px] font-bold uppercase tracking-widest text-majapahit-light-gold">Level 3</span>
      <span class="font-poppins text-[10px] font-semibold text-stone-soft">Nemokke Ukara</span>
    </div>
    <div class="flex items-center gap-3.5 pointer-events-auto">
      <div class="flex h-[50px] w-[130px] flex-col items-center justify-center pt-0.5" style="background-image:url('/assets/images/bingkai kecil.svg');background-size:100% 100%">
        <span class="font-poppins text-[8.5px] uppercase tracking-widest text-stone-soft/75">Waktu</span>
        <span id="l3-time-val" class="font-cinzel text-[15px] font-bold text-majapahit-cream leading-tight">00:00</span>
      </div>
      <div class="flex h-[50px] w-[130px] flex-col items-center justify-center pt-0.5" style="background-image:url('/assets/images/bingkai kecil.svg');background-size:100% 100%">
        <span class="font-poppins text-[8.5px] uppercase tracking-widest text-stone-soft/75">Ukara</span>
        <span id="l3-progress-val" class="font-cinzel text-[15px] font-bold text-majapahit-cream leading-tight">0 / 5</span>
      </div>
      <div class="flex h-[50px] w-[130px] flex-col items-center justify-center pt-0.5" style="background-image:url('/assets/images/bingkai kecil.svg');background-size:100% 100%">
        <span class="font-poppins text-[8.5px] uppercase tracking-widest text-stone-soft/75">Skor</span>
        <span id="l3-score-val" class="font-cinzel text-[15px] font-bold text-majapahit-light-gold leading-tight">0</span>
      </div>
      <button id="l3-btn-exit" class="ml-1 flex h-10 w-10 cursor-pointer items-center justify-center rounded-xl border border-majapahit-dark-gold/80 bg-stone-dark/85 text-stone-soft transition hover:scale-105 hover:border-majapahit-gold hover:text-majapahit-cream active:scale-95" title="Kembali ke peta" aria-label="Kembali ke peta">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- 1. Gulungan kertas sing ditemokake -->
  <div id="l3-scroll-stage" class="absolute inset-0 z-10 flex flex-col items-center justify-center opacity-0 transition-opacity duration-500">
    <button id="l3-rolled" class="pointer-events-auto relative mt-28 cursor-pointer border-0 bg-transparent p-0 transition-transform duration-200 hover:-rotate-2 hover:scale-105 focus-visible:outline-2 focus-visible:outline-majapahit-gold" aria-label="Bukak gulungan kertas">
      <svg width="320" height="130" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="l3-paper" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f6e9c4"/><stop offset=".55" stop-color="#e3c98f"/><stop offset="1" stop-color="#b9975a"/>
          </linearGradient>
          <linearGradient id="l3-rod" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8a5a2b"/><stop offset="1" stop-color="#3a220c"/>
          </linearGradient>
        </defs>
        <ellipse cx="160" cy="116" rx="140" ry="10" fill="rgba(0,0,0,.35)"/>
        <rect x="34" y="34" width="252" height="70" rx="35" fill="url(#l3-paper)" stroke="#8b6a2b" stroke-width="2"/>
        <path d="M60 46 H262 M60 92 H262" stroke="#c9a96a" stroke-width="2" opacity=".7"/>
        <rect x="14" y="44" width="26" height="52" rx="8" fill="url(#l3-rod)"/>
        <rect x="280" y="44" width="26" height="52" rx="8" fill="url(#l3-rod)"/>
        <rect x="148" y="30" width="24" height="78" rx="4" fill="#9e2b1e"/>
        <path d="M160 108 l-12 20 M160 108 l12 20" stroke="#9e2b1e" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </button>
    <div id="l3-rolled-hint" class="pointer-events-none mt-6 flex items-center gap-2 rounded-full border-2 border-majapahit-gold bg-stone-dark/90 px-4 py-1.5 shadow-lg">
      <span class="animate-wa-pointer-bounce text-[18px] leading-none">👆</span>
      <span class="font-poppins text-[12px] font-bold uppercase tracking-wider text-majapahit-cream">Kowe nemokake gulungan kertas, klik kanggo mbukak</span>
    </div>
  </div>

  <!-- 2. Perintah tantangan ing gulungan sing kabukak -->
  <div id="l3-command" class="wa-modal-container z-50 hidden opacity-0 transition-opacity duration-300">
    <div class="w-[640px]">
      <div class="l2-scroll-rod"></div>
      <div id="l3-command-paper" class="l3-unroll l2-scroll-paper">
        <div class="px-12 py-7 text-center">
          <p class="font-poppins text-[10px] font-bold uppercase tracking-widest text-[#6b4a22]">Perintah Tantangan</p>
          <h2 id="l3-command-title" class="mt-1 font-cinzel text-[24px] font-bold uppercase tracking-widest text-[#4a2f14]"></h2>
          <div class="mx-auto mt-3 h-px w-2/3 bg-[#8b6a2b]/60"></div>
          <p id="l3-command-text" class="mt-4 font-poppins text-[14px] font-semibold leading-relaxed text-[#4a2f14]"></p>
        </div>
      </div>
      <div class="l2-scroll-rod"></div>
      <div class="mt-5 flex justify-center">
        <button id="l3-btn-command-next" class="kenney-button h-11 w-[240px] cursor-pointer font-poppins text-[12px] font-bold uppercase tracking-widest text-stone-dark transition hover:scale-105 active:scale-95">Miwiti ›</button>
      </div>
    </div>
  </div>

  <!-- 3. Ukara siji-siji: klik tembung sing salah, bener-ake nganggo keyboard -->
  <div id="l3-puzzle" class="absolute inset-0 z-10 hidden flex-col items-center pt-[100px] opacity-0 transition-opacity duration-500">
    <div class="flex w-[1060px] items-center justify-between px-2">
      <span id="l3-step" class="rounded-md border border-majapahit-dark-gold/70 bg-stone-dark/85 px-3 py-1 font-poppins text-[12px] font-bold text-majapahit-light-gold">Ukara 1 / 5</span>
      <span class="rounded-md bg-stone-dark/80 px-3 py-1 font-poppins text-[11px] text-stone-soft/80">Klik tembung sing salah, banjur tulisen sing bener.</span>
    </div>

    <div class="l2-tablet mt-3 flex w-[1060px] flex-col items-center px-10 pb-5 pt-5">
      <div class="l2-tablet-inner flex min-h-[120px] w-full items-center justify-center px-4">
        <p id="l3-sentence" class="l1-stone-text pointer-events-auto font-local-javanese text-[40px] leading-none whitespace-nowrap"></p>
      </div>
      <p id="l3-latin" class="mt-3 font-poppins text-[15px] font-semibold text-[#2c2924]"></p>
    </div>

    <p id="l3-prompt" class="mt-10 rounded-full border-2 border-majapahit-gold bg-stone-dark/90 px-5 py-2 font-poppins text-[13px] font-bold uppercase tracking-wider text-majapahit-cream shadow-lg">👆 Klik tembung sing salah ing prasasti</p>
  </div>

  <!-- Panel keyboard aksara -->
  <div id="l3-kb-panel" class="absolute inset-x-0 bottom-0 z-30 hidden h-[318px] translate-y-full transition-transform duration-500 ease-out pointer-events-auto">
    <div class="l1-board-solid flex h-full w-full gap-5 border-t-4 border-majapahit-gold/90 px-6 pb-4 pt-4 shadow-[0_-14px_44px_rgba(0,0,0,.65)]">
      <!-- Kiri: tembung sing dipilih + wangsulan -->
      <div class="flex w-[310px] shrink-0 flex-col gap-2.5">
        <div class="rounded-xl border border-majapahit-gold/40 bg-stone-dark/90 px-3 py-2">
          <p class="font-poppins text-[10px] font-bold uppercase tracking-wider text-majapahit-light-gold/90">Tembung sing kok pilih</p>
          <div class="flex items-center justify-between gap-2">
            <span id="l3-selected-aksara" class="font-local-javanese whitespace-nowrap pb-4 pt-2 text-[28px] leading-none text-[#f0b5ad]"></span>
            <span id="l3-selected-latin" class="font-poppins text-[12px] font-semibold text-stone-soft/80"></span>
          </div>
        </div>
        <div class="flex flex-1 flex-col rounded-xl border-2 border-majapahit-gold/70 bg-[#241c16] px-3 py-2">
          <p class="font-poppins text-[10px] font-bold uppercase tracking-wider text-majapahit-light-gold/90">Wangsulanmu</p>
          <div class="flex flex-1 items-center justify-center">
            <span id="l3-preview" class="l3-caret font-local-javanese whitespace-nowrap pb-5 pt-2 text-[34px] leading-none text-majapahit-cream"></span>
          </div>
        </div>
        <div class="flex gap-2">
          <button id="l3-btn-help" class="wa-util h-11 w-11 shrink-0 cursor-pointer text-[16px] font-bold text-majapahit-light-gold" title="Tutorial keyboard">?</button>
          <button id="l3-btn-check" class="kenney-button h-11 flex-1 cursor-pointer font-poppins text-[13px] font-bold uppercase tracking-widest text-stone-dark transition hover:scale-105 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:scale-100">Priksa ✓</button>
        </div>
      </div>
      <!-- Kanan: keyboard aksara -->
      <div id="l3-kb-mount" class="flex flex-1 items-center justify-center"></div>
    </div>
  </div>
</div>
